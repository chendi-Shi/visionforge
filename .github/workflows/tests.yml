name: Offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-robot-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-robot-lock.txt
      - name: Run offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Recompute published robot benchmark without inference
        run: python -S tools/verify_robot_release.py artifacts/robot-benchmark
      - name: Recompute post-hoc grouping stress test using only the standard library
        run: python -S artifacts/robot-sensitivity/verify.py --main-bundle artifacts/robot-benchmark
